<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>区域截图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; cursor: crosshair; }
    body {
      background: rgba(0, 0, 0, 0.3);
      user-select: none;
    }
    #selection {
      position: absolute;
      border: 2px dashed #4A90D9;
      background: rgba(74, 144, 217, 0.1);
      display: none;
      pointer-events: none;
    }
    #info {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-family: -apple-system, sans-serif;
      font-size: 13px;
      z-index: 9999;
    }
    #size-info {
      position: fixed;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 9999;
      display: none;
    }
  </style>
</head>
<body>
  <div id="info">按住鼠标左键选择截图区域 · 按 ESC 取消</div>
  <div id="selection"></div>
  <div id="size-info"></div>

  <script>
    const selection = document.getElementById('selection');
    const sizeInfo = document.getElementById('size-info');

    let startX = 0, startY = 0, isDrawing = false;

    document.addEventListener('mousedown', (e) => {
      isDrawing = true;
      startX = e.clientX;
      startY = e.clientY;
      selection.style.left = startX + 'px';
      selection.style.top = startY + 'px';
      selection.style.width = '0px';
      selection.style.height = '0px';
      selection.style.display = 'block';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const currentX = e.clientX;
      const currentY = e.clientY;

      const x = Math.min(startX, currentX);
      const y = Math.min(startY, currentY);
      const w = Math.abs(currentX - startX);
      const h = Math.abs(currentY - startY);

      selection.style.left = x + 'px';
      selection.style.top = y + 'px';
      selection.style.width = w + 'px';
      selection.style.height = h + 'px';

      sizeInfo.style.left = (x + w + 10) + 'px';
      sizeInfo.style.top = y + 'px';
      sizeInfo.textContent = `${Math.round(w)} × ${Math.round(h)}`;
      sizeInfo.style.display = 'block';
    });

    document.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;

      const x = parseInt(selection.style.left);
      const y = parseInt(selection.style.top);
      const w = parseInt(selection.style.width);
      const h = parseInt(selection.style.height);

      if (w > 5 && h > 5) {
        window.regionAPI.sendSelection({ x, y, width: w, height: h });
      } else {
        window.regionAPI.sendCancelled();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.regionAPI.sendCancelled();
      }
    });

    document.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>
